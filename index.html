<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dune 2 Lite</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="hud">
    <div id="hud-spice" aria-label="spice">🍂 <b>Spice:</b> <span id="spice">0</span></div>
    <div id="hud-carried" aria-label="carried">🛢️ <b>Carried:</b> <span id="carried">0</span></div>
    <div id="hud-bcount" aria-label="barracks-count">🏠 <b>Barracks:</b> <span id="bcount">0</span></div>
    <div id="hud-ucount" aria-label="unit-count">👥 <b>Troops:</b> <span id="ucount">0</span></div>
    <div id="hud-controls" style="margin-left:8px">Shortcuts: B build · T train · Space center</div>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="tooltip" role="tooltip" aria-hidden="true" style="display:none;position:fixed;pointer-events:none;padding:6px 8px;background:rgba(0,0,0,0.8);color:#fff;border-radius:4px;font-size:13px;z-index:9999;">tooltip</div>
  <div id="log"></div>

  <script type="module" src="js/engine.js"></script>
  <script type="module" src="js/level1.js"></script>
  <!-- <script type="module" src="js/level2.js"></script> -->
</body>
</html>
